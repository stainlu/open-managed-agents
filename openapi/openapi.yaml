openapi: 3.1.0
info:
  title: Open Managed Agents API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: API-first managed-agent layer for OpenClaw, Hermes, Codex, Claude Agent SDK, and future agent harnesses.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, commit, start_ts, uptime_ms, max_warm, max_active]
                properties:
                  ok:
                    type: boolean
                    const: true
                  version:
                    type: string
                  commit:
                    type: string
                  start_ts:
                    type: integer
                  uptime_ms:
                    type: integer
                  max_warm:
                    type: integer
                  max_active:
                    type: integer
                  runtime:
                    type: object
                    description: Optional sanitized runtime substrate readiness. Never contains platform ids or secrets.
                    additionalProperties: true
                    properties:
                      platform:
                        type: string
                        examples: [self-hosted, cloudflare]
                      stack:
                        type: string
                        examples: [container-docker, cloudflare-flue]
                      mode:
                        type: string
                        examples: [container, native]
                      default_harness:
                        $ref: "#/components/schemas/HarnessId"
                      bindings:
                        type: object
                        additionalProperties:
                          type: boolean
                      features:
                        type: object
                        additionalProperties:
                          type: boolean
  /v1/models:
    get:
      summary: Curated model catalog
      responses:
        "200":
          description: Model catalog
  /v1/harnesses:
    get:
      summary: List registered harness adapters, runtime modes, and capability support
      responses:
        "200":
          description: Harness catalog
          content:
            application/json:
              schema:
                type: object
                required: [default_harness_id, harnesses, count]
                properties:
                  default_harness_id:
                    $ref: "#/components/schemas/HarnessId"
                  harnesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Harness"
                  count:
                    type: integer
  /v1/agents:
    post:
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    get:
      summary: List agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  count:
                    type: integer
  /v1/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      summary: Get agent
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    patch:
      summary: Update agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          description: Version conflict or archived agent
    delete:
      summary: Hard-delete agent
      responses:
        "200":
          description: Deleted
  /v1/agents/{agentId}/versions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      summary: List immutable agent versions
      responses:
        "200":
          description: Versions
  /v1/agents/{agentId}/archive:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Archive agent
      responses:
        "200":
          description: Archived agent
  /v1/agents/{agentId}/warm:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Queue warm-pool preboot for an agent
      responses:
        "202":
          description: Warm queued
  /v1/agents/{agentId}/run:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Backwards-compatible one-shot run adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task:
                  type: string
                sessionId:
                  type: string
      responses:
        "200":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAgentResult"
  /v1/agents/{agentId}/files:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: query
        name: session_id
        required: true
        schema:
          type: string
      - in: query
        name: path
        schema:
          type: string
        description: Relative workspace directory to list. Defaults to the workspace root.
    get:
      summary: List files in an agent session workspace
      responses:
        "200":
          description: Workspace directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFileList"
  /v1/agents/{agentId}/files/{filePath}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/FilePath"
      - in: query
        name: session_id
        required: true
        schema:
          type: string
    get:
      summary: Read a file from an agent session workspace
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    put:
      summary: Write a file into an agent session workspace
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFileWriteResult"
    delete:
      summary: Delete a file from an agent session workspace
      responses:
        "200":
          description: File delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFileDeleteResult"
  /v1/environments:
    post:
      summary: Create environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    get:
      summary: List environments
      responses:
        "200":
          description: Environments
  /v1/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      summary: Get environment
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Delete environment
      responses:
        "200":
          description: Deleted
        "409":
          description: Environment is still referenced by sessions
  /v1/vaults:
    post:
      summary: Create credential vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "200":
          description: Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
    get:
      summary: List vaults
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
      responses:
        "200":
          description: Vaults
  /v1/vaults/{vaultId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
    get:
      summary: Get vault metadata
      responses:
        "200":
          description: Vault
    delete:
      summary: Delete vault and credentials
      responses:
        "200":
          description: Deleted
  /v1/vaults/{vaultId}/credentials:
    parameters:
      - $ref: "#/components/parameters/VaultId"
    post:
      summary: Add credential to vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCredentialRequest"
      responses:
        "200":
          description: Credential metadata; secret fields omitted
    get:
      summary: List vault credential metadata
      responses:
        "200":
          description: Credential metadata
  /v1/vaults/{vaultId}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - in: path
        name: credentialId
        required: true
        schema:
          type: string
    delete:
      summary: Delete credential
      responses:
        "200":
          description: Deleted
  /v1/sessions:
    post:
      summary: Create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    get:
      summary: List sessions
      responses:
        "200":
          description: Sessions
  /v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      summary: Delete session and runtime state
      responses:
        "200":
          description: Deleted
  /v1/sessions/{sessionId}/children:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Create a managed child session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Child session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    get:
      summary: List direct managed child sessions
      responses:
        "200":
          description: Direct child sessions
          content:
            application/json:
              schema:
                type: object
                required: [session_id, count, children]
                properties:
                  session_id:
                    type: string
                  count:
                    type: integer
                  children:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
  /v1/sessions/{sessionId}/session-tree:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read recursive managed session lineage
      responses:
        "200":
          description: Session tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTree"
    delete:
      summary: Delete a managed session tree
      responses:
        "200":
          description: Aggregate deletion result for the root session and descendants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTreeResult"
  /v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Post user message or tool confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PostUserMessage"
                - $ref: "#/components/schemas/PostToolConfirmation"
      responses:
        "200":
          description: Accepted immediately or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEventResult"
        "202":
          description: Started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEventResult"
    get:
      summary: List events or stream SSE with stream=true
      parameters:
        - in: query
          name: stream
          schema:
            type: boolean
        - in: query
          name: run_id
          schema:
            type: string
          description: Return only events for this managed run id.
        - in: query
          name: parent_run_id
          schema:
            type: string
          description: Return only direct child events of this parent run id.
      responses:
        "200":
          description: Events JSON or text/event-stream
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
            text/event-stream:
              schema:
                type: string
  /v1/sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Cancel in-flight turn
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResult"
  /v1/sessions/{sessionId}/cancel-tree:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Cancel in-flight work across a managed session tree
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelTreeRequest"
      responses:
        "200":
          description: Aggregate cancellation result for the root session and descendants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelTreeResult"
  /v1/sessions/{sessionId}/approvals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: List pending tool approvals for a session
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                required: [session_id, approvals]
                properties:
                  session_id:
                    type: string
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"
  /v1/sessions/{sessionId}/approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/ApprovalId"
    post:
      summary: Resolve a pending tool approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveApprovalRequest"
      responses:
        "200":
          description: Approval resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveApprovalResult"
        "404":
          description: Session or approval not found
  /v1/sessions/{sessionId}/runs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: List managed runs for a session
      responses:
        "200":
          description: Managed runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedRun"
  /v1/sessions/{sessionId}/run-tree:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read managed run tree projection for a session
      responses:
        "200":
          description: Run tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTree"
  /v1/sessions/{sessionId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Get one managed run
      responses:
        "200":
          description: Managed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRun"
        "404":
          description: Session or run not found
  /v1/sessions/{sessionId}/runs/{runId}/abort:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Abort a queued or active managed run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRunRequest"
      responses:
        "200":
          description: Run abort result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbortRunResult"
  /v1/sessions/{sessionId}/compact:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Compact session context
      responses:
        "200":
          description: Compacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactResult"
  /v1/sessions/{sessionId}/logs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - in: query
        name: tail
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    get:
      summary: Snapshot live container logs
      responses:
        "200":
          description: Plain-text logs
          content:
            text/plain:
              schema:
                type: string
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions adapter
      parameters:
        - in: header
          name: x-openclaw-agent-id
          required: true
          schema:
            type: string
          description: Agent id to run behind the OpenAI-compatible API.
        - in: header
          name: x-openclaw-session-key
          schema:
            type: string
          description: Optional stable OMA session id/key for named-session resume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or streaming SSE chunks
          headers:
            x-oma-run-id:
              schema:
                type: string
              description: Managed run id for the accepted turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatCompletion"
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid OpenAI-compatible request
  /v1/audit:
    get:
      summary: List audit events
      parameters:
        - in: query
          name: since
          schema:
            type: integer
        - in: query
          name: until
          schema:
            type: integer
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events, count]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  count:
                    type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      in: path
      name: agentId
      required: true
      schema:
        type: string
    EnvironmentId:
      in: path
      name: environmentId
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
    FilePath:
      in: path
      name: filePath
      required: true
      schema:
        type: string
      description: Relative workspace path. Slash-containing paths are handled by the server wildcard route.
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema:
        type: string
    VaultId:
      in: path
      name: vaultId
      required: true
      schema:
        type: string
  schemas:
    Agent:
      type: object
      required: [agent_id, harness_id, model, tools, instructions, permission_policy, version, created_at, updated_at]
      properties:
        agent_id:
          type: string
        harness_id:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        instructions:
          type: string
        permission_policy:
          $ref: "#/components/schemas/PermissionPolicy"
        name:
          type: [string, "null"]
        callable_agents:
          type: array
          items:
            type: string
        max_subagent_depth:
          type: integer
        mcp_servers:
          type: object
          additionalProperties: true
        quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
        version:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
        archived_at:
          type: [integer, "null"]
    CreateAgentRequest:
      type: object
      required: [model]
      properties:
        harnessId:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        instructions:
          type: string
          default: ""
        tools:
          type: array
          items:
            type: string
        name:
          type: string
        permissionPolicy:
          $ref: "#/components/schemas/PermissionPolicy"
        callableAgents:
          type: array
          items:
            type: string
        maxSubagentDepth:
          type: integer
          minimum: 0
        mcpServers:
          type: object
          additionalProperties: true
        quota:
          $ref: "#/components/schemas/Quota"
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
    UpdateAgentRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        harnessId:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        instructions:
          type: [string, "null"]
        tools:
          type:
            - array
            - "null"
          items:
            type: string
        name:
          type: [string, "null"]
        permissionPolicy:
          $ref: "#/components/schemas/PermissionPolicy"
        callableAgents:
          type:
            - array
            - "null"
          items:
            type: string
        maxSubagentDepth:
          type: integer
          minimum: 0
        mcpServers:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
    PermissionPolicy:
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              const: always_allow
        - type: object
          required: [type, tools]
          properties:
            type:
              const: deny
            tools:
              type: array
              items:
                type: string
        - type: object
          required: [type]
          properties:
            type:
              const: always_ask
            tools:
              type: array
              items:
                type: string
    ThinkingLevel:
      type: string
      enum: [off, low, medium, high, xhigh]
    HarnessId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]*$"
      examples: [openclaw, hermes, codex, claude-agent-sdk, flue]
    HarnessCapability:
      type: object
      required: [support, detail]
      properties:
        support:
          type: string
          enum: [supported, partial, unsupported]
        detail:
          type: string
    HarnessCapabilities:
      type: object
      required:
        - start_turn
        - streaming
        - native_session_resume
        - cancellation
        - interruption
        - dynamic_model_patch
        - compaction
        - tool_approvals
        - permission_deny
        - mcp
        - managed_event_log
        - usage
        - subagents
      properties:
        start_turn:
          $ref: "#/components/schemas/HarnessCapability"
        streaming:
          $ref: "#/components/schemas/HarnessCapability"
        native_session_resume:
          $ref: "#/components/schemas/HarnessCapability"
        cancellation:
          $ref: "#/components/schemas/HarnessCapability"
        interruption:
          $ref: "#/components/schemas/HarnessCapability"
        dynamic_model_patch:
          $ref: "#/components/schemas/HarnessCapability"
        compaction:
          $ref: "#/components/schemas/HarnessCapability"
        tool_approvals:
          $ref: "#/components/schemas/HarnessCapability"
        permission_deny:
          $ref: "#/components/schemas/HarnessCapability"
        mcp:
          $ref: "#/components/schemas/HarnessCapability"
        managed_event_log:
          $ref: "#/components/schemas/HarnessCapability"
        usage:
          $ref: "#/components/schemas/HarnessCapability"
        subagents:
          $ref: "#/components/schemas/HarnessCapability"
    Harness:
      type: object
      required: [harness_id, name, runtime_mode, capabilities]
      properties:
