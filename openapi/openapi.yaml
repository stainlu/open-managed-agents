openapi: 3.1.0
info:
  title: Open Managed Agents API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: API-first managed-agent layer for OpenClaw, Hermes, Codex, Claude Agent SDK, and future agent harnesses.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Healthy
  /v1/models:
    get:
      summary: Curated model catalog
      responses:
        "200":
          description: Model catalog
  /v1/harnesses:
    get:
      summary: List registered harness adapters and capability support
      responses:
        "200":
          description: Harness catalog
          content:
            application/json:
              schema:
                type: object
                required: [default_harness_id, harnesses, count]
                properties:
                  default_harness_id:
                    $ref: "#/components/schemas/HarnessId"
                  harnesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Harness"
                  count:
                    type: integer
  /v1/agents:
    post:
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    get:
      summary: List agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  count:
                    type: integer
  /v1/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      summary: Get agent
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    patch:
      summary: Update agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          description: Version conflict or archived agent
    delete:
      summary: Hard-delete agent
      responses:
        "200":
          description: Deleted
  /v1/agents/{agentId}/versions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      summary: List immutable agent versions
      responses:
        "200":
          description: Versions
  /v1/agents/{agentId}/archive:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Archive agent
      responses:
        "200":
          description: Archived agent
  /v1/agents/{agentId}/warm:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Queue warm-pool preboot for an agent
      responses:
        "202":
          description: Warm queued
  /v1/agents/{agentId}/run:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      summary: Backwards-compatible one-shot run adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task:
                  type: string
                sessionId:
                  type: string
      responses:
        "200":
          description: Run started
  /v1/environments:
    post:
      summary: Create environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    get:
      summary: List environments
      responses:
        "200":
          description: Environments
  /v1/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      summary: Get environment
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Delete environment
      responses:
        "200":
          description: Deleted
        "409":
          description: Environment is still referenced by sessions
  /v1/vaults:
    post:
      summary: Create credential vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "200":
          description: Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
    get:
      summary: List vaults
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
      responses:
        "200":
          description: Vaults
  /v1/vaults/{vaultId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
    get:
      summary: Get vault metadata
      responses:
        "200":
          description: Vault
    delete:
      summary: Delete vault and credentials
      responses:
        "200":
          description: Deleted
  /v1/vaults/{vaultId}/credentials:
    parameters:
      - $ref: "#/components/parameters/VaultId"
    post:
      summary: Add credential to vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCredentialRequest"
      responses:
        "200":
          description: Credential metadata; secret fields omitted
    get:
      summary: List vault credential metadata
      responses:
        "200":
          description: Credential metadata
  /v1/vaults/{vaultId}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - in: path
        name: credentialId
        required: true
        schema:
          type: string
    delete:
      summary: Delete credential
      responses:
        "200":
          description: Deleted
  /v1/sessions:
    post:
      summary: Create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    get:
      summary: List sessions
      responses:
        "200":
          description: Sessions
  /v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      summary: Delete session and runtime state
      responses:
        "200":
          description: Deleted
  /v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Post user message or tool confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PostUserMessage"
                - $ref: "#/components/schemas/PostToolConfirmation"
      responses:
        "200":
          description: Accepted immediately or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEventResult"
        "202":
          description: Started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEventResult"
    get:
      summary: List events or stream SSE with stream=true
      parameters:
        - in: query
          name: stream
          schema:
            type: boolean
        - in: query
          name: run_id
          schema:
            type: string
          description: Return only events for this managed run id.
        - in: query
          name: parent_run_id
          schema:
            type: string
          description: Return only direct child events of this parent run id.
      responses:
        "200":
          description: Events JSON or text/event-stream
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
            text/event-stream:
              schema:
                type: string
  /v1/sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Cancel in-flight turn
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResult"
  /v1/sessions/{sessionId}/approvals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: List pending tool approvals for a session
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                required: [session_id, approvals]
                properties:
                  session_id:
                    type: string
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"
  /v1/sessions/{sessionId}/approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/ApprovalId"
    post:
      summary: Resolve a pending tool approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveApprovalRequest"
      responses:
        "200":
          description: Approval resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveApprovalResult"
        "404":
          description: Session or approval not found
  /v1/sessions/{sessionId}/runs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: List managed runs for a session
      responses:
        "200":
          description: Managed runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedRun"
  /v1/sessions/{sessionId}/run-tree:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Read managed run tree projection for a session
      responses:
        "200":
          description: Run tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTree"
  /v1/sessions/{sessionId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Get one managed run
      responses:
        "200":
          description: Managed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRun"
        "404":
          description: Session or run not found
  /v1/sessions/{sessionId}/runs/{runId}/abort:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Abort a queued or active managed run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortRunRequest"
      responses:
        "200":
          description: Run abort result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbortRunResult"
  /v1/sessions/{sessionId}/compact:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Compact session context
      responses:
        "200":
          description: Compacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactResult"
  /v1/sessions/{sessionId}/logs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - in: query
        name: tail
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    get:
      summary: Snapshot live container logs
      responses:
        "200":
          description: Plain-text logs
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      in: path
      name: agentId
      required: true
      schema:
        type: string
    EnvironmentId:
      in: path
      name: environmentId
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema:
        type: string
    VaultId:
      in: path
      name: vaultId
      required: true
      schema:
        type: string
  schemas:
    Agent:
      type: object
      required: [agent_id, harness_id, model, tools, instructions, permission_policy, version, created_at, updated_at]
      properties:
        agent_id:
          type: string
        harness_id:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        instructions:
          type: string
        permission_policy:
          $ref: "#/components/schemas/PermissionPolicy"
        name:
          type: [string, "null"]
        callable_agents:
          type: array
          items:
            type: string
        max_subagent_depth:
          type: integer
        mcp_servers:
          type: object
          additionalProperties: true
        quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
        version:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
        archived_at:
          type: [integer, "null"]
    CreateAgentRequest:
      type: object
      required: [model]
      properties:
        harnessId:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        instructions:
          type: string
          default: ""
        tools:
          type: array
          items:
            type: string
        name:
          type: string
        permissionPolicy:
          $ref: "#/components/schemas/PermissionPolicy"
        callableAgents:
          type: array
          items:
            type: string
        maxSubagentDepth:
          type: integer
          minimum: 0
        mcpServers:
          type: object
          additionalProperties: true
        quota:
          $ref: "#/components/schemas/Quota"
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
    UpdateAgentRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        harnessId:
          $ref: "#/components/schemas/HarnessId"
        model:
          type: string
        instructions:
          type: [string, "null"]
        tools:
          type:
            - array
            - "null"
          items:
            type: string
        name:
          type: [string, "null"]
        permissionPolicy:
          $ref: "#/components/schemas/PermissionPolicy"
        callableAgents:
          type:
            - array
            - "null"
          items:
            type: string
        maxSubagentDepth:
          type: integer
          minimum: 0
        mcpServers:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        quota:
          anyOf:
            - $ref: "#/components/schemas/Quota"
            - type: "null"
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingLevel"
        channels:
          type: object
          additionalProperties: true
    PermissionPolicy:
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              const: always_allow
        - type: object
          required: [type, tools]
          properties:
            type:
              const: deny
            tools:
              type: array
              items:
                type: string
        - type: object
          required: [type]
          properties:
            type:
              const: always_ask
            tools:
              type: array
              items:
                type: string
    ThinkingLevel:
      type: string
      enum: [off, low, medium, high, xhigh]
    HarnessId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]*$"
      examples: [openclaw, hermes, codex, claude-agent-sdk]
    HarnessCapability:
      type: object
      required: [support, detail]
      properties:
        support:
          type: string
          enum: [supported, partial, unsupported]
        detail:
          type: string
    HarnessCapabilities:
      type: object
      required:
        - start_turn
        - streaming
        - native_session_resume
        - cancellation
        - interruption
        - dynamic_model_patch
        - compaction
        - tool_approvals
        - permission_deny
        - mcp
        - managed_event_log
        - usage
        - subagents
      properties:
        start_turn:
          $ref: "#/components/schemas/HarnessCapability"
        streaming:
          $ref: "#/components/schemas/HarnessCapability"
        native_session_resume:
          $ref: "#/components/schemas/HarnessCapability"
        cancellation:
          $ref: "#/components/schemas/HarnessCapability"
        interruption:
          $ref: "#/components/schemas/HarnessCapability"
        dynamic_model_patch:
          $ref: "#/components/schemas/HarnessCapability"
        compaction:
          $ref: "#/components/schemas/HarnessCapability"
        tool_approvals:
          $ref: "#/components/schemas/HarnessCapability"
        permission_deny:
          $ref: "#/components/schemas/HarnessCapability"
        mcp:
          $ref: "#/components/schemas/HarnessCapability"
        managed_event_log:
          $ref: "#/components/schemas/HarnessCapability"
        usage:
          $ref: "#/components/schemas/HarnessCapability"
        subagents:
          $ref: "#/components/schemas/HarnessCapability"
    Harness:
      type: object
      required: [harness_id, name, capabilities]
      properties:
        harness_id:
          $ref: "#/components/schemas/HarnessId"
        name:
          type: string
        capabilities:
          $ref: "#/components/schemas/HarnessCapabilities"
    Quota:
      type: object
      properties:
        maxCostUsdPerSession:
          type: number
          exclusiveMinimum: 0
        maxTokensPerSession:
          type: integer
          minimum: 1
        maxWallDurationMs:
          type: integer
          minimum: 1
    Environment:
      type: object
      properties:
        environment_id:
          type: string
        name:
          type: string
        description:
          type: string
        packages:
          type: object
          additionalProperties: true
        networking:
          type: object
          additionalProperties: true
        created_at:
          type: integer
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        packages:
          type: object
          additionalProperties: true
        networking:
          type: object
          additionalProperties: true
    Vault:
      type: object
      properties:
        vault_id:
          type: string
        user_id:
          type: string
        name:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
    CreateVaultRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        name:
          type: string
    AddCredentialRequest:
      oneOf:
        - type: object
          required: [name, type, matchUrl, token]
          properties:
            name:
              type: string
            type:
              const: static_bearer
            matchUrl:
              type: string
            token:
              type: string
              writeOnly: true
        - type: object
          required: [name, type, matchUrl, accessToken, refreshToken, expiresAt, tokenEndpoint, clientId, clientSecret]
          properties:
            name:
              type: string
            type:
              const: mcp_oauth
            matchUrl:
              type: string
            accessToken:
              type: string
              writeOnly: true
            refreshToken:
              type: string
              writeOnly: true
            expiresAt:
              type: integer
            tokenEndpoint:
              type: string
              format: uri
            clientId:
              type: string
            clientSecret:
              type: string
              writeOnly: true
            scopes:
              type: array
              items:
                type: string
    Session:
      type: object
      properties:
        session_id:
          type: string
        agent_id:
          type: string
        harness_id:
          $ref: "#/components/schemas/HarnessId"
        environment_id:
          type: [string, "null"]
        status:
          type: string
          enum: [idle, starting, running, failed]
        output:
          type: [string, "null"]
        tokens:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        cost_usd:
          type: number
        error:
          type: [string, "null"]
        created_at:
          type: integer
        last_event_at:
          type: [integer, "null"]
        turns:
          type: integer
        boot_ms:
          type: [integer, "null"]
        pool_source:
          type: [string, "null"]
        container_id:
          type: [string, "null"]
        container_name:
          type: [string, "null"]
        parent_session_id:
          type: [string, "null"]
    CreateSessionRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
        environmentId:
          type: string
        vaultId:
          type: string
    PostUserMessage:
      type: object
      required: [content]
      properties:
        type:
          const: user.message
          default: user.message
        content:
          type: string
        model:
          type: string
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingLevel"
    PostToolConfirmation:
      type: object
      required: [type, toolUseId, result]
      properties:
        type:
          const: user.tool_confirmation
        toolUseId:
          type: string
        result:
          type: string
          enum: [allow, deny]
        denyMessage:
          type: string
    SendEventResult:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
        run_id:
          type: string
        session_status:
          type: string
        queued:
          type: boolean
        confirmed:
          type: boolean
    Event:
      type: object
      required: [event_id, session_id, type, content, created_at]
      properties:
        event_id:
          type: string
        session_id:
          type: string
        type:
          type: string
        content:
          type: string
        created_at:
          type: integer
        tokens:
          anyOf:
            - type: object
              properties:
                input:
                  type: integer
                output:
                  type: integer
            - type: "null"
        cost_usd:
          type: [number, "null"]
        model:
          type: [string, "null"]
        tool_name:
          type: [string, "null"]
        tool_call_id:
          type: [string, "null"]
        tool_arguments:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        is_error:
          type: [boolean, "null"]
        approval_id:
          type: [string, "null"]
        run_id:
          type: [string, "null"]
        run_kind:
          type: [string, "null"]
        run_status:
          type: [string, "null"]
        parent_run_id:
          type: [string, "null"]
        event_index:
          type: [integer, "null"]
    Approval:
      type: object
      required: [approval_id, session_id, tool_name, description, arrived_at]
      properties:
        approval_id:
          type: string
        session_id:
          type: string
        tool_name:
          type: string
        tool_call_id:
          type: [string, "null"]
        description:
          type: string
        arrived_at:
          type: integer
    ResolveApprovalRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, deny]
    ResolveApprovalResult:
      type: object
      required: [session_id, approval_id, decision, resolved]
      properties:
        session_id:
          type: string
        approval_id:
          type: string
        decision:
          type: string
          enum: [allow, deny]
        resolved:
          const: true
    ManagedRunStatus:
      type: string
      enum: [queued, starting, running, succeeded, failed, cancelled, skipped]
    ManagedRun:
      type: object
      required: [run_id, session_id, agent_id, status, queued, error, created_at, started_at, completed_at]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        agent_id:
          type: string
        status:
          $ref: "#/components/schemas/ManagedRunStatus"
        queued:
          type: boolean
        model:
          type: [string, "null"]
        thinking_level:
          anyOf:
            - $ref: "#/components/schemas/ThinkingLevel"
            - type: "null"
        error:
          type: [string, "null"]
        created_at:
          type: integer
        started_at:
          type: [integer, "null"]
        completed_at:
          type: [integer, "null"]
    RunTreeSource:
      type: object
      required: [managed_run, event_log]
      properties:
        managed_run:
          type: boolean
        event_log:
          type: boolean
    RunTreeNode:
      type: object
      required: [run_id, event_count, source, children]
      properties:
        run_id:
          type: string
        parent_run_id:
          type: [string, "null"]
        run_kind:
          type: [string, "null"]
        status:
          type: [string, "null"]
        managed_status:
          anyOf:
            - $ref: "#/components/schemas/ManagedRunStatus"
            - type: "null"
        queued:
          type: [boolean, "null"]
        created_at:
          type: [integer, "null"]
        started_at:
          type: [integer, "null"]
        completed_at:
          type: [integer, "null"]
        first_event_at:
          type: [integer, "null"]
        last_event_at:
          type: [integer, "null"]
        event_count:
          type: integer
        tokens:
          anyOf:
            - type: object
              properties:
                input:
                  type: integer
                output:
                  type: integer
            - type: "null"
        cost_usd:
          type: [number, "null"]
        model:
          type: [string, "null"]
        is_error:
          type: [boolean, "null"]
        source:
          $ref: "#/components/schemas/RunTreeSource"
        children:
          type: array
          items:
            $ref: "#/components/schemas/RunTreeNode"
    RunTree:
      type: object
      required: [session_id, count, runs]
      properties:
        session_id:
          type: string
        count:
          type: integer
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunTreeNode"
    AbortRunRequest:
      type: object
      properties:
        reason:
          type: string
    AbortRunResult:
      type: object
      required: [session_id, session_status, run, aborted, removed_queued]
      properties:
        session_id:
          type: string
        session_status:
          type: string
        run:
          $ref: "#/components/schemas/ManagedRun"
        aborted:
          type: boolean
        removed_queued:
          type: boolean
    CancelResult:
      type: object
      required: [session_id, session_status, cancelled]
      properties:
        session_id:
          type: string
        session_status:
          type: string
        cancelled:
          const: true
    CompactResult:
      type: object
      required: [session_id, session_status, compacted]
      properties:
        session_id:
          type: string
        session_status:
          type: string
        compacted:
          const: true
